</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;c79-portfolio-bg.mp4&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;grade&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Âmbar quente&quot;,&quot;Teal &amp; âmbar&quot;,&quot;Mono âmbar&quot;],&quot;default&quot;:&quot;Âmbar quente&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;grain&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;paused&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;blobs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;blobAmount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:1.8,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;hoverOnly&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;raio&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:400,&quot;min&quot;:40,&quot;max&quot;:420,&quot;step&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;densidade&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;minBlobSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:2,&quot;max&quot;:400,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;maxBlobSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1650,&quot;min&quot;:50,&quot;max&quot;:5000,&quot;step&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;glow&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;reactivity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:1.5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#d5a24e&quot;,&quot;#b8752e&quot;,&quot;#f0dcb4&quot;,&quot;#ffffff&quot;],&quot;default&quot;:&quot;#d5a24e&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;cores&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;ids&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;linhas&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;entrada&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Rápida&quot;,&quot;Suave&quot;,&quot;Lenta&quot;,&quot;Íris&quot;,&quot;Escalonado&quot;],&quot;default&quot;:&quot;Suave&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Blob track&quot;},&quot;saida&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Rápida&quot;,&quot;Suave&quot;,&quot;Lenta&quot;,&quot;Rasto&quot;,&quot;Íris&quot;,&quot;Escalonado&quot;],&quot;default&quot;:&quot;Escalonado&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Blob track&quot;}}">
const SW = 168, SH = 94;

class Component extends DCLogic {
  videoRef = React.createRef();
  blobRef = React.createRef();
  raf = 0;
  visible = true;
  hover = false;
  hoverK = 0;
  activeEl = null;
  mx = -9999;
  my = -9999;
  tracks = [];
  nextId = 1;
  energy = 0;
  prevMean = 0;
  last = 0;

  p(key, dflt) {
    const v = this.props[key];
    return v !== undefined && v !== null && v !== "" ? v : dflt;
  }

  rgb(hex) {
    const h = String(hex || "#d5a24e").replace("#", "");
    const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  sync() {
    const v = this.videoRef.current;
    if (!v) return;
    v.muted = true;
    if (this.props.paused) v.pause();
    else { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  }

  setup() {
    const n = SW * SH;
    if (!this.sctx) {
      this.sample = document.createElement("canvas");
      this.sample.width = SW; this.sample.height = SH;
      this.sctx = this.sample.getContext("2d", { willReadFrequently: true });
    }
    if (!this.lum || this.lum.length !== n) {
      this.lum = new Float32Array(n);
      this.tmp = new Float32Array(n);
      this.blurBuf = new Float32Array(n);
      this.diff = new Float32Array(n);
      this.mask = new Uint8Array(n);
      this.lab = new Int32Array(n);
      this.parent = new Int32Array((n >> 1) + 2);
    }
  }

  find(a) { const p = this.parent; while (p[a] !== a) { p[a] = p[p[a]]; a = p[a]; } return a; }
  union(a, b) { a = this.find(a); b = this.find(b); if (a !== b) this.parent[b > a ? b : a] = b > a ? a : b; }

  blur(r) {
    const L = this.lum, T = this.tmp, B = this.blurBuf, d = 2 * r + 1;
    for (let y = 0; y < SH; y++) {
      const row = y * SW;
      let acc = 0;
      for (let k = -r; k <= r; k++) acc += L[row + (k < 0 ? 0 : k > SW - 1 ? SW - 1 : k)];
      for (let x = 0; x < SW; x++) {
        T[row + x] = acc / d;
        const o = x - r, i2 = x + r + 1;
        acc += L[row + (i2 > SW - 1 ? SW - 1 : i2)] - L[row + (o < 0 ? 0 : o)];
      }
    }
    for (let x = 0; x < SW; x++) {
      let acc = 0;
      for (let k = -r; k <= r; k++) acc += T[(k < 0 ? 0 : k > SH - 1 ? SH - 1 : k) * SW + x];
      for (let y = 0; y < SH; y++) {
        B[y * SW + x] = acc / d;
        const o = y - r, i2 = y + r + 1;
        acc += T[(i2 > SH - 1 ? SH - 1 : i2) * SW + x] - T[(o < 0 ? 0 : o) * SW + x];
      }
    }
  }

  detect(dens) {
    const L = this.lum, M = this.mask, lab = this.lab, P = this.parent, D = this.diff, B = this.blurBuf;
    this.blur(6);
    let sq = 0;
    for (let i = 0; i < D.length; i++) { const v = L[i] - B[i]; D[i] = v; sq += v * v; }
    const sigma = Math.sqrt(sq / D.length) || 1e-4;
    const thr = sigma * (2.35 - dens * 2.05);
    for (let i = 0; i < M.length; i++) M[i] = (D[i] > thr && L[i] > 0.05) ? 1 : 0;

    let next = 1;
    const cap = P.length - 1;
    for (let y = 0; y < SH; y++) {
      const row = y * SW;
      for (let x = 0; x < SW; x++) {
        const i = row + x;
        if (!M[i]) { lab[i] = 0; continue; }
        const up = y > 0 ? lab[i - SW] : 0;
        const lf = x > 0 ? lab[i - 1] : 0;
        if (!up && !lf) { if (next >= cap) { lab[i] = 0; continue; } P[next] = next; lab[i] = next; next++; }
        else if (up && lf) { lab[i] = up < lf ? up : lf; if (up !== lf) this.union(up, lf); }
        else lab[i] = up || lf;
      }
    }

    const boxes = new Map();
    for (let y = 0; y < SH; y++) {
      const row = y * SW;
      for (let x = 0; x < SW; x++) {
        const l = lab[row + x];
        if (!l) continue;
        const r = this.find(l);
        let b = boxes.get(r);
        if (!b) { b = { x0: x, y0: y, x1: x, y1: y, n: 0, sum: 0, cx: 0, cy: 0, lum: 0 }; boxes.set(r, b); }
        if (x < b.x0) b.x0 = x;
        if (x > b.x1) b.x1 = x;
        if (y < b.y0) b.y0 = y;
        if (y > b.y1) b.y1 = y;
        b.n++; b.cx += x; b.cy += y; b.sum += D[row + x];
      }
    }

    const min = this.p("minBlobSize", 2), max = this.p("maxBlobSize", 1650);
    const out = [];
    boxes.forEach((b) => {
      if (b.n < min || b.n > max) return;
      b.cx /= b.n; b.cy /= b.n;
      b.lum = Math.min(1, (b.sum / b.n) / (thr + 1e-5) * 0.5);
      out.push(b);
    });
    out.sort((a, b) => b.n - a.n);
    return out.slice(0, 30);
  }

  track(blobs) {
    const live = this.tracks;
    for (let i = 0; i < live.length; i++) live[i].seen = false;
    for (const b of blobs) {
      let best = null, bd = 9;
      for (const t of live) {
        if (t.seen) continue;
        const d = Math.hypot(t.cx - b.cx, t.cy - b.cy);
        if (d < bd) { bd = d; best = t; }
      }
      if (best) {
        best.seen = true; best.ttl = 22;
        best.tcx = b.cx; best.tcy = b.cy;
        best.tx0 = b.x0; best.tx1 = b.x1; best.ty0 = b.y0; best.ty1 = b.y1;
        best.n = b.n; best.lum = b.lum;
        best.age = Math.min(1, best.age + 0.09);
      } else {
        live.push({ id: this.nextId++, cx: b.cx, cy: b.cy, x0: b.x0, x1: b.x1, y0: b.y0, y1: b.y1, tcx: b.cx, tcy: b.cy, tx0: b.x0, tx1: b.x1, ty0: b.y0, ty1: b.y1, n: b.n, lum: b.lum, ttl: 22, age: 0, seen: true });
      }
    }
    if (this.nextId > 999) this.nextId = 1;
    this.tracks = live.filter((t) => { if (!t.seen) { t.ttl -= 2; t.age = Math.max(0, t.age - 0.06); } return t.ttl > 0; });
    return this.tracks;
  }

  sprite(base) {
    this.sprites = this.sprites || new Map();
    let s = this.sprites.get(base);
    if (s) return s;
    s = document.createElement("canvas");
    s.width = s.height = 96;
    const c = s.getContext("2d");
    const g = c.createRadialGradient(48, 48, 0, 48, 48, 48);
    g.addColorStop(0, "rgba(" + base + ",0.5)");
    g.addColorStop(0.42, "rgba(" + base + ",0.14)");
    g.addColorStop(1, "rgba(" + base + ",0)");
    c.fillStyle = g;
    c.fillRect(0, 0, 96, 96);
    this.sprites.set(base, s);
    return s;
  }

  advance(fs) {
    const kc = 1 - Math.pow(0.68, fs), kb = 1 - Math.pow(0.7, fs);
    for (const t of this.tracks) {
      if (t.tcx === undefined) continue;
      t.cx += (t.tcx - t.cx) * kc; t.cy += (t.tcy - t.cy) * kc;
      t.x0 += (t.tx0 - t.x0) * kb; t.x1 += (t.tx1 - t.x1) * kb;
      t.y0 += (t.ty0 - t.y0) * kb; t.y1 += (t.ty1 - t.y1) * kb;
    }
  }

  frame = (now) => {
    this.raf = requestAnimationFrame(this.frame);
    try { this.tick(now); } catch (e) { this.stop(); }
  };

  tick(now) {
    const cv = this.blobRef.current, v = this.videoRef.current;
    if (!cv || !v) return;
    if (now - this.last < 21) return;
    const dt = Math.min(64, now - (this.last || now - 22));
    this.last = now;
    const fs = Math.max(0.25, dt / 33.33);
    const ease = (r) => 1 - Math.pow(1 - r, fs);
    if (document.hidden || !this.visible || v.readyState < 2) return;

    const dpr = 1;
    const W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr);
    if (!W || !H) return;
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    const ctx = cv.getContext("2d");
    this.setup();

    const hoverOnly = this.p("hoverOnly", true);
    const hk = this.hover || !hoverOnly ? 1 : 0;
    const rising = hk > this.hoverK;
    const modeIn = this.p("entrada", "Suave"), modeOut = this.p("saida", "Escalonado");
    const mode = rising ? modeIn : modeOut;
    const rate = rising
      ? (modeIn === "Rápida" ? 0.26 : modeIn === "Lenta" ? 0.055 : 0.13)
      : (modeOut === "Rápida" ? 0.15 : modeOut === "Rasto" ? 0.04 : modeOut === "Lenta" ? 0.03 : 0.065);
    this.hoverK += (hk - this.hoverK) * ease(rate);
    if (hoverOnly && this.hoverK < 0.003) { ctx.clearRect(0, 0, W, H); return; }

    if (now - (this.lastDet || 0) >= 30) {
      this.lastDet = now;
      let data;
      try {
        this.sctx.drawImage(v, 0, 0, SW, SH);
        data = this.sctx.getImageData(0, 0, SW, SH).data;
      } catch (e) { this.stop(); return; }

      const L = this.lum;
      let sum = 0;
      for (let i = 0, p = 0; i < L.length; i++, p += 4) {
        const l = (data[p] * 0.299 + data[p + 1] * 0.587 + data[p + 2] * 0.114) / 255;
        L[i] = l; sum += l;
      }
      const mean = sum / L.length;

      const d = Math.abs(mean - this.prevMean);
      this.prevMean = mean;
      const hit = Math.min(1, d * 34) * this.p("reactivity", 1);
      this.energy += (hit - this.energy) * (hit > this.energy ? 0.5 : 0.06);

      this.track(this.detect(this.p("densidade", 1)));
    }
    this.advance(fs);
    const tracks = this.tracks;

    const kx = W / SW, ky = H / SH;
    const amt = this.p("blobAmount", 1);
    const glow = this.p("glow", 1);
    const showIds = this.p("ids", true);
    const multi = this.p("cores", true);
    const [ar, ag, ab] = this.rgb(this.p("accent", "#d5a24e"));
    const pulse = 1 + this.energy * 0.16;

    const rect = cv.getBoundingClientRect();
    const px = (this.mx - rect.left) * dpr, py = (this.my - rect.top) * dpr;
    const R = Math.max(1, this.p("raio", 400) * dpr);

    const linhas = this.p("linhas", true);
    let lx = 0, ly = 0, hasLogo = false;
    if (linhas) {
      if (!this.logoEl || !this.logoEl.isConnected) this.logoEl = document.querySelector("[data-c79-logo]");
      if (this.logoEl) {
        const lb = this.logoEl.getBoundingClientRect();
        if (lb.width || lb.height) {
          lx = (lb.left + lb.width / 2 - rect.left) * dpr;
          ly = (lb.top + lb.height / 2 - rect.top) * dpr;
          hasLogo = true;
        }
      }
    }

    let rx0 = 0, ry0 = 0, rx1 = 0, ry1 = 0, boxed = false;
    if (hoverOnly && this.activeEl && this.activeEl.isConnected) {
      const b = this.activeEl.getBoundingClientRect();
      if (b.width || b.height) {
        const pad = 6 * dpr;
        rx0 = (b.left - rect.left) * dpr - pad;
        ry0 = (b.top - rect.top) * dpr - pad;
        rx1 = (b.right - rect.left) * dpr + pad;
        ry1 = (b.bottom - rect.top) * dpr + pad;
        boxed = true;
      }
    }

    ctx.clearRect(0, 0, W, H);
    ctx.lineJoin = "round";
    ctx.font = "500 " + Math.round(9.5 * dpr) + "px 'IBM Plex Mono', monospace";
    let shown = 0, cover = 0;

    for (const t of tracks) {
      const w = (t.x1 - t.x0 + 1) * kx * pulse;
      const h = (t.y1 - t.y0 + 1) * ky * pulse;
      const x = t.cx * kx - w / 2;
      const y = t.cy * ky - h / 2;

      let f = 1, kb = this.hoverK;
      if (hoverOnly) {
        const bx = t.cx * kx, by = t.cy * ky;
        let dx, dy;
        dx = bx - px; dy = by - py;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const Reff = mode === "Íris" ? R * (0.18 + 0.82 * this.hoverK) : R;
        const q = 1 - dist / Reff;
        if (q <= 0) continue;
        f = q * q * (3 - 2 * q);
        if (mode === "Rasto") kb = Math.sqrt(this.hoverK);
        else if (mode === "Escalonado") {
          const off = Math.min(1, dist / R) * 0.55;
          kb = Math.max(0, Math.min(1, (this.hoverK - off) / (1 - off)));
        }
      }
      const gate = f * kb;
      if (gate < 0.02) continue;
      shown++; cover += t.n;

      const hot = Math.min(1, t.lum * 0.9 + 0.22);
      let cr = ar, cg = ag, cb = ab;
      if (multi) {
        if (hot > 0.78) { cr = 255; cg = 240; cb = 214; }
        else if (hot > 0.5) { cr = 240; cg = 180; cb = 109; }
      }
      const base = cr + "," + cg + "," + cb;
      const a = t.age * (0.34 + hot * 0.5) * (0.82 + this.energy * 0.3) * (0.3 + gate * 0.85) * amt;

      const dotX = t.cx * kx, dotY = t.cy * ky;

      if (hasLogo) {
        const vx = dotX - lx, vy = dotY - ly;
        const len = Math.hypot(vx, vy) || 1;
        const bend = (t.id % 2 ? 1 : -1) * len * (0.13 + 0.05 * Math.sin(now / 1400 + t.id));
        const qx = lx + vx * 0.5 - (vy / len) * bend;
        const qy = ly + vy * 0.5 + (vx / len) * bend;
        const g = ctx.createLinearGradient(lx, ly, dotX, dotY);
        g.addColorStop(0, "rgba(" + base + ",0)");
        g.addColorStop(0.22, "rgba(" + base + "," + Math.min(0.9, a * 0.5).toFixed(3) + ")");
        g.addColorStop(1, "rgba(" + base + "," + Math.min(1, a * 1.45).toFixed(3) + ")");
        ctx.strokeStyle = g;
        ctx.lineWidth = 1.35 * dpr;
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.quadraticCurveTo(qx, qy, dotX, dotY);
        ctx.stroke();
      }

      if (glow > 0.02) {
        const gs = Math.max(w, h) + 40 * dpr;
        ctx.globalAlpha = Math.min(0.8, a * glow * 1.2);
        ctx.drawImage(this.sprite(base), dotX - gs / 2, dotY - gs / 2, gs, gs);
        ctx.globalAlpha = 1;
      }

      ctx.strokeStyle = "rgba(" + base + "," + a.toFixed(3) + ")";
      ctx.lineWidth = 1.15 * dpr;
      ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(w), Math.round(h));

      const tick = Math.min(w, h) * 0.26;
      ctx.lineWidth = 1.9 * dpr;
      ctx.strokeStyle = "rgba(" + base + "," + (a * 1.25).toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(x, y + tick); ctx.lineTo(x, y); ctx.lineTo(x + tick, y);
      ctx.moveTo(x + w - tick, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - tick);
      ctx.stroke();

      const cd = (1.6 + this.energy * 1.4) * dpr;
      ctx.fillStyle = "rgba(" + base + "," + Math.min(0.95, a * 2).toFixed(3) + ")";
      ctx.fillRect(t.cx * kx - cd, t.cy * ky - cd, cd * 2, cd * 2);

      if (showIds && t.age > 0.45 && w > 22 * dpr) {
        ctx.fillStyle = "rgba(" + base + "," + (a * 1.5).toFixed(3) + ")";
        ctx.fillText(String(t.id).padStart(3, "0"), x, y - 5 * dpr);
      }
    }
    this.sc = (this.sc || 0) + 1;
    if (this.sc % 5 === 0) {
      window.dispatchEvent(new CustomEvent("c79:bt", {
        detail: { shown: shown, blobs: tracks.length, cover: cover / (SW * SH) }
      }));
    }
  }

  onOver = (e) => {
    if (e.pointerType === "touch") return;
    const t = e.target && e.target.closest ? e.target.closest("[data-blob]") : null;
    if (!t) return;
    this.hover = true;
    this.activeEl = t;
    this.mx = e.clientX; this.my = e.clientY;
  };

  onOut = (e) => {
    const to = e.relatedTarget;
    if (to && to.closest && to.closest("[data-blob]")) return;
    this.hover = false;
  };

  onMove = (e) => { if (this.hover) { this.mx = e.clientX; this.my = e.clientY; } };
  onBlur = () => { this.hover = false; };

  start() {
    if (this.raf || !this.blobRef.current) return;
    if (!this.io && window.IntersectionObserver) {
      this.io = new IntersectionObserver((es) => { this.visible = es[0].isIntersecting; }, { threshold: 0 });
      this.io.observe(this.blobRef.current);
    }
    this.raf = requestAnimationFrame(this.frame);
  }

  stop() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; }

  componentDidMount() {
    this.sync();
    if ((this.props.blobs ?? true) && !this.props.paused) this.start();
    document.addEventListener("pointerover", this.onOver, true);
    document.addEventListener("pointerout", this.onOut, true);
    document.addEventListener("pointermove", this.onMove, { passive: true });
    window.addEventListener("blur", this.onBlur);
  }

  componentDidUpdate() {
    this.sync();
    if ((this.props.blobs ?? true) && !this.props.paused) this.start(); else this.stop();
  }

  componentWillUnmount() {
    this.stop();
    document.removeEventListener("pointerover", this.onOver, true);
    document.removeEventListener("pointerout", this.onOut, true);
    document.removeEventListener("pointermove", this.onMove);
    window.removeEventListener("blur", this.onBlur);
    if (this.io) { this.io.disconnect(); this.io = null; }
  }

  renderVals() {
    const grade = this.props.grade ?? "Âmbar quente";
    return {
      videoRef: this.videoRef,
      blobRef: this.blobRef,
      blobs: (this.props.blobs ?? true) && !this.props.paused,
      src: this.props.src ?? "c79-portfolio-bg.mp4",
      grain: this.props.grain ?? true,
      isAmber: grade === "Âmbar quente",
      isTeal: grade === "Teal & âmbar",
      isMono: grade === "Mono âmbar"
    };
  }
}

</script>
