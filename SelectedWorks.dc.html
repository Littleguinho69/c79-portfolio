<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @font-face { font-family: 'BNCringeSerifLight'; src: url('BNCringeSerifLight.ttf') format('truetype'); font-weight: 300 400; font-style: normal; font-display: swap; }
  </style>
  <style>
    @keyframes c79-modal-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes c79-pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: none; } }
  </style>
</helmet>
<section id="work" style="position:relative; z-index:10; width:100%; max-width:1280px; margin:0 auto; padding:128px 24px; box-sizing:border-box; font-family:'Inter',sans-serif">
  <div style="margin-bottom:64px">
    <h2 style="font-family:'BNCringeSerifLight','BN Cringe Serif Light','BNCringeSerif','Cormorant Garamond',serif; font-weight:300; font-size:clamp(38px,5.4vw,62px); letter-spacing:-0.01em; line-height:1.02; margin:0; color:hsl(0 0% 100%)">Selected Works</h2>
    <div style="width:100%; height:1px; background:rgba(255,255,255,0.14); margin-top:32px"></div>
  </div>

  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap:32px">
    <sc-for list="{{ projects }}" as="p" hint-placeholder-count="2">
      <div onClick="{{ p.open }}" onMouseEnter="{{ p.enter }}" onMouseLeave="{{ p.leave }}" style="position:relative; aspect-ratio:16 / 9; overflow:hidden; border-radius:3px; cursor:pointer; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08)">
        <img src="{{ p.image }}" alt="" onError="{{ hideImg }}" style="width:100%; height:100%; object-fit:cover; display:block; transition:transform 700ms cubic-bezier(.16,1,.3,1); transform:{{ p.imageTransform }}">

        <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.75) 100%); pointer-events:none"></div>
        <div style="position:absolute; inset:0; transition:background 500ms ease; background:{{ p.scrim }}; pointer-events:none"></div>

        <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; transition:opacity 500ms ease, transform 500ms cubic-bezier(.16,1,.3,1); opacity:{{ p.playOpacity }}; transform:{{ p.playTransform }}">
          <div style="width:64px; height:64px; border-radius:9999px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.1); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.2); color:#fff">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="margin-left:4px"><path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.29-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z"></path></svg>
          </div>
        </div>

        <div style="position:absolute; left:0; right:0; bottom:0; padding:32px; pointer-events:none">
          <h3 style="margin:0 0 4px; font-family:'Inter',sans-serif; font-size:24px; font-weight:500; letter-spacing:-0.01em; color:#fff; text-wrap:pretty">{{ p.title }}</h3>
          <p style="margin:0; font-size:14px; color:rgba(255,255,255,0.7)">{{ p.role }}</p>
        </div>
      </div>
    </sc-for>
  </div>
</section>

<sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ close }}" style="position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; background:rgba(0,0,0,0.9); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); animation:c79-modal-in 300ms ease both">
    <button type="button" onClick="{{ close }}" aria-label="Close" style="position:absolute; top:24px; right:24px; display:flex; align-items:center; justify-content:center; width:44px; height:44px; padding:0; border:none; background:transparent; color:rgba(255,255,255,0.7); cursor:pointer; transition:color 200ms ease" style-hover="color:#fff">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div onClick="{{ stop }}" style="position:relative; width:100%; max-width:1152px; aspect-ratio:16 / 9; background:#000; border-radius:8px; overflow:hidden; border:1px solid rgba(255,255,255,0.1); box-shadow:0 40px 100px rgba(0,0,0,0.6); animation:c79-pop 350ms cubic-bezier(.16,1,.3,1) 80ms both">
      <iframe src="{{ embedSrc }}" title="Video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen="{{ true }}" frameBorder="0" style="width:100%; height:100%; border:none; display:block"></iframe>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;projects&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ id: number; title: string; role: string; image: string; videoUrl: string }[]&quot;}}">
const DEFAULT_PROJECTS = [
  {
    id: 1,
    title: "G! x @Cozzy2x - IMPÉRIO!",
    role: "Direção & Edição",
    image: "https://img.youtube.com/vi/rzkhOSozi4A/maxresdefault.jpg",
    videoUrl: "https://www.youtube.com/embed/rzkhOSozi4A"
  },
  {
    id: 2,
    title: "Hazard - Uma Voz",
    role: "Direção & Edição",
    image: "https://img.youtube.com/vi/w9nP3UJMZsQ/maxresdefault.jpg",
    videoUrl: "https://www.youtube.com/embed/w9nP3UJMZsQ"
  },
  {
    id: 3,
    title: "Hawaiana",
    role: "Direção & Edição",
    image: "photos/thumbs/hawaiana.jpg",
    videoUrl: "https://drive.google.com/file/d/1oIOjG_1e5Xu3_lhsIhA34j7JhLYE1_pV/preview"
  },
  {
    id: 4,
    title: "Ondas Do Mar",
    role: "Direção & Edição",
    image: "photos/thumbs/ondas.jpg",
    videoUrl: "https://drive.google.com/file/d/1JQR1x_giboXMx--W53EZ_-3zXaiyhs_Y/preview"
  }
];

class Component extends DCLogic {
  state = { hovered: null, selected: null };

  onKeyDown = (e) => {
    if (e.key === "Escape") this.setState({ selected: null });
  };

  componentDidMount() { document.addEventListener("keydown", this.onKeyDown); }
  componentWillUnmount() { document.removeEventListener("keydown", this.onKeyDown); }

  renderVals() {
    const list = this.props.projects ?? DEFAULT_PROJECTS;
    const projects = list.map((p) => {
      const on = this.state.hovered === p.id;
      return {
        ...p,
        imageTransform: on ? "scale(1.05)" : "scale(1)",
        scrim: on ? "rgba(0,0,0,0.55)" : "rgba(0,0,0,0.18)",
        playOpacity: on ? 1 : 0,
        playTransform: on ? "scale(1)" : "scale(0.9)",
        enter: () => this.setState({ hovered: p.id }),
        leave: () => this.setState((s) => (s.hovered === p.id ? { hovered: null } : null)),
        open: () => this.setState({ selected: p.videoUrl })
      };
    });

    return {
      projects,
      modalOpen: !!this.state.selected,
      embedSrc: this.state.selected
        ? this.state.selected + (this.state.selected.indexOf("youtube.com") > -1 ? "?autoplay=1&rel=0" : "")
        : "",
      hideImg: (e) => { e.target.style.opacity = "0"; },
      close: () => this.setState({ selected: null }),
      stop: (e) => e.stopPropagation()
    };
  }
}
</script>
</body>
</html>
